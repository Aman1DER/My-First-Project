<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .add-to-cart:hover {
        background-color: rgb(0, 255, 102);
        opacity: 0.7;
      }
      .add-to-cart:active {
        background-color: rgb(0, 255, 102);
        opacity: 1;
      }
.buy-now:hover {
        background-color: rgb(12, 10, 10);
        color: rgb(255, 183, 0);
        opacity: 0.7;
      }
      .add-to-cart {
        background-color: rgb(250, 250, 45);
        border-radius: 50px;
        border-style: solid;
        border-color: rgb(250, 250, 45);
        color: rgb(12, 10, 10);
        height: 50px;
        width: 200px;
        font-family: Arial, Helvetica, sans-serif;
        font-style: bold;
        font-size: medium;
        cursor: pointer;
        margin-right: 10px;
      }
      .price {
        color: green;
      }
      .back-to-amazon {
        color: rgb(49, 49, 235);
      }
      .buy-now {
        background-color: rgb(255, 183, 0);
        border-radius: 50px;
        border-style: solid;
        border-color: rgb(255, 208, 0);
        color: rgb(12, 10, 10);
        height: 50px;
        width: 200px;
        font-family: Arial, Helvetica, sans-serif;
        font-style: bold;
       font-size: medium;
        cursor: pointer; 
      }
      .order {
        background-color: rgb(0, 238, 255);
        border-radius: 50px;
        border-style: solid;
        border-color: rgb(0, 149, 255);
        color: rgb(12, 10, 10);
        height: 50px;
        width: 200px;
        font-family: Arial, Helvetica, sans-serif;
        font-style: bold;
        font-size: medium;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h3 class="back-to-amazon"><u>Back to Amazon</u></h3>
    <br /><br />
    <h2>Nike Black Running Shoes</h2>
    <h3 class="price">$39-in stock</h3>
    <button class="add-to-cart">Add to Cart</button>
    <button class="buy-now">Buy Now</button>
    <button class="order">Order it</button>
  </body>
</html>
