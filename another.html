<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .apply-button:hover {
        background-color: rgb(0, 81, 200);
      }
      .save:hover {
        background-color: rgb(200, 213, 243);
        color: rgb(6, 72, 138);
      }
      .apply-button {
        background-color: rgb(0, 81, 255);
        color: white;
        border-radius: 50px;
        height: 50px;
        width: 200px;
        cursor: pointer;
        border: none;
        font-style: bold;
        font-size: small;
      }
      .save {
        background-color: rgb(249, 248, 247);
        color: rgb(22, 66, 225);
        border-radius: 50px;
        height: 50px;
        width: 80px;
        cursor: pointer;
        border: blue solid 2px;
      }
    </style>
  </head>
  <body>
    <button class="apply-button">Apply on company website</button>

    <button class="save">Save</button>
  </body>
</html>
