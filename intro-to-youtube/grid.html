<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
        .div1{
            display: grid;
            grid-template-columns: 100px 100px; 
            column-gap: 10px;
            row-gap: 10px;
        }
        .thumbnail{
            width: 220px;
            
        }
        .video-title{
        font-family: Roboto, Arial;
        margin-top: 0;
        margin-bottom: 0;
        }
        .description{
        color: rgb(96, 96, 96);
        font-size: 12px;
        display: inline-block;
        }
        .add-friend{
            background-color: #0059ff;
            color: white;
            border: none;
            border-radius: 4px;;
        }
        .channel-icon{
            width: 40px;
            border-radius: 50%;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="div1">
        <div>
            <img class="thumbnail" src="../intro-to-youtube/thumbnails/thumbnail-1.webp" alt="">
            <p class="video-title">Oliver</p>
            <img class="channel-icon" src="../intro-to-youtube/channel-pictures/channel-1.jpeg" alt="">
            <p class="description">2 Mituals</p>
            <button class="add-friend">Add friend</button>
        </div>
        <div class="div1">
            <img class="thumbnail" src="../intro-to-youtube/thumbnails/thumbnail-2.webp" alt="">
            <p class="video-title">Bella</p>
            <img class="channel-icon" src="../intro-to-youtube/channel-pictures/channel-2.jpeg" alt="">
            <p class="description">5 Mituals</p>
             <button class="add-friend">Add friend</button>
        </div>
    </div>
</body>
</html>
