<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Website</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #101820;
        color: white;
      }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 25px 8%;
        background: #17232e;
      }

      nav h2 {
        color: #00d4ff;
      }

      nav a {
        color: white;
        text-decoration: none;
        margin-left: 25px;
      }

      nav a:hover {
        color: #00d4ff;
      }

      .hero {
        height: 85vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
      }

      .hero h1 {
        font-size: 50px;
        margin-bottom: 20px;
      }

      .hero span {
        color: #00d4ff;
      }

      .hero p {
        font-size: 18px;
        color: #bbbbbb;
        margin-bottom: 30px;
      }

      button {
        background: #00d4ff;
        color: #101820;
        border: none;
        padding: 14px 30px;
        border-radius: 25px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background: white;
      }

      footer {
        text-align: center;
        padding: 20px;
        background: #17232e;
        color: #aaa;
      }
    </style>
  </head>

  <body>
    <nav>
      <h2>WELCOME TO MY WEBSITE</h2>

      <div>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
      </div>
    </nav>

    <section class="hero">
      <h1>Welcome to <span>My Website</span></h1>

      <p>
        I'm a passionate web developer and designer, dedicated to creating
        beautiful and functional websites. Explore creativity, technology and
        innovation. Build something amazing today.
      </p>

      <button onclick="showMessage()">Get Started</button>
    </section>

    <footer>
      <p>© 2026 MyWebsite. All rights reserved.</p>
    </footer>

    <script>
      function showMessage() {
        alert("Welcome! Thanks for visiting my website.Enjoy exploring the content and feel free to reach out if you have any questions or feedback.");
      }
    </script>
  </body>
</html>
